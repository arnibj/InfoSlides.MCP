name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet publish src/InfoSlides.Cli -c Release -r ${{ matrix.rid }} -p:Version=${GITHUB_REF_NAME#v}
        shell: bash
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd src/InfoSlides.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish
          tar czf "$GITHUB_WORKSPACE/infoslides-${GITHUB_REF_NAME}-${{ matrix.rid }}.tar.gz" infoslides
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "src/InfoSlides.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/infoslides.exe" `
            -DestinationPath "infoslides-$env:GITHUB_REF_NAME-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: infoslides-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The repo is needed for the manifest/server.json templates and the bundle script; the
      # binaries come from the build job's artifacts.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Stage binaries for bundling
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p staging/win-x64 staging/linux-x64 staging/osx-arm64

          for rid in linux-x64 osx-arm64; do
            tar xzf "artifacts/infoslides-${GITHUB_REF_NAME}-${rid}.tar.gz" -C "staging/${rid}"
          done
          unzip -q "artifacts/infoslides-${GITHUB_REF_NAME}-win-x64.zip" -d staging/win-x64

      - name: Build MCPB bundle and server.json
        shell: bash
        run: |
          chmod +x scripts/build-mcpb.sh
          scripts/build-mcpb.sh "${GITHUB_REF_NAME#v}" staging "$PWD/artifacts"

      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum infoslides-* > sha256sums.txt
          cat sha256sums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/infoslides-*
            artifacts/server.json
            artifacts/sha256sums.txt
          generate_release_notes: true
