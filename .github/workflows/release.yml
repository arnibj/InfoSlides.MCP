name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Only the release job, which publishes, gets write access, and it waits for
# the owner's approval in the `release` environment first: a pushed tag alone ships nothing.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet publish src/InfoSlides.Cli -c Release -r ${{ matrix.rid }} -p:Version=${GITHUB_REF_NAME#v}
        shell: bash
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd src/InfoSlides.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish
          tar czf "$GITHUB_WORKSPACE/infoslides-${GITHUB_REF_NAME}-${{ matrix.rid }}.tar.gz" infoslides
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "src/InfoSlides.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/infoslides.exe" `
            -DestinationPath "infoslides-$env:GITHUB_REF_NAME-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.rid }}
          path: infoslides-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write # signs the provenance attestation
      attestations: write
    steps:
      # The repo is needed for the manifest/server.json templates and the bundle script; the
      # binaries come from the build job's artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: artifacts

      - name: Stage binaries for bundling
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p staging/win-x64 staging/linux-x64 staging/osx-arm64

          for rid in linux-x64 osx-arm64; do
            tar xzf "artifacts/infoslides-${GITHUB_REF_NAME}-${rid}.tar.gz" -C "staging/${rid}"
          done
          unzip -q "artifacts/infoslides-${GITHUB_REF_NAME}-win-x64.zip" -d staging/win-x64

      - name: Build MCPB bundle and server.json
        shell: bash
        run: |
          chmod +x scripts/build-mcpb.sh
          scripts/build-mcpb.sh "${GITHUB_REF_NAME#v}" staging "$PWD/artifacts"

      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum infoslides-* > sha256sums.txt
          cat sha256sums.txt

      # Ties each file to this repository and this workflow run, so
      # `gh attestation verify <file> --repo arnibj/InfoSlides.MCP` fails for anything built elsewhere.
      # artifacts/infoslides-* covers the archives and the .mcpb bundle.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/infoslides-*
            artifacts/server.json

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/infoslides-*
            artifacts/server.json
            artifacts/sha256sums.txt
          generate_release_notes: true

      # The steps after the release are manual on purpose (the registry listing is public and awkward to retract),
      # so the summary hands over the exact commands. See docs/PUBLISHING.md.
      - name: Next steps summary
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## Next steps for v${VERSION}"
            echo
            echo "1. Install the .mcpb from this release in a real MCP client and use it."
            echo "2. Publish to the MCP registry:"
            echo '```bash'
            echo "gh workflow run publish-registry.yml --repo ${GITHUB_REPOSITORY} -f version=${VERSION}"
            echo '```'
            echo "3. Redeploy the hosted server (infoslides-mcp), unless a directory review hold is on."
            echo "4. Check every surface matches the release:"
            echo '```powershell'
            echo "./scripts/check-release-sync.ps1 -Version ${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
