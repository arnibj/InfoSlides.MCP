name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet test --no-build --verbosity normal

      # The README's quickstart pins an exact download URL, which makes it a copy of the version
      # number that no build step touches. It had already drifted three releases behind (v1.2.0
      # while latest was v1.3.2), silently handing every new reader a stale binary. Same failure
      # mode as the hardcoded version that turned 1.0.1 -> 1.1.0 into a red build, so it gets the
      # same treatment: the csproj's <Version> stays the only source of truth, and drifting from
      # it is an explicit error naming both values.
      #
      # The pin is deliberate rather than a /releases/latest redirect: the asset filename carries
      # the version, so there is no fixed name for `latest/download/` to resolve to.
      - name: README install pin matches the csproj version
        shell: bash
        run: |
          set -euo pipefail
          CSPROJ_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/InfoSlides.Cli/InfoSlides.Cli.csproj)"

          if [[ -z "$CSPROJ_VERSION" ]]; then
            echo "::error::Could not parse <Version> from InfoSlides.Cli.csproj" >&2
            exit 1
          fi

          # Every release-download URL in the README must name the current version.
          BAD="$(grep -n 'releases/download/' README.md | grep -v "v${CSPROJ_VERSION}/" || true)"

          if [[ -n "$BAD" ]]; then
            echo "::error::README download links are pinned to a version other than the csproj's ${CSPROJ_VERSION}:" >&2
            echo "$BAD" >&2
            exit 1
          fi

          echo "README download links all pin v${CSPROJ_VERSION}."

  publish-aot:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet publish src/InfoSlides.Cli -c Release -r ${{ matrix.rid }}

      # Read the expected version out of the csproj rather than hardcoding it here — a third
      # hardcoded copy in CI is what turned bumping 1.0.1 -> 1.1.0 into a red build.
      #
      # The csproj's <Version> is now the *only* source of truth: VersionInfo.cs no longer
      # hardcodes a second copy — it reads the running assembly's own version metadata (which the
      # release workflow sets via -p:Version= at publish time, and which defaults to <Version>
      # for a local/CI build). That's what the "Smoke test native binary" step below actually
      # proves, end to end, against the real published binary — a stronger guarantee than
      # comparing two source-text copies ever was, since a text-level match can't catch the
      # binary itself reporting something else at runtime.
      - name: Resolve expected version
        shell: bash
        run: |
          set -euo pipefail
          CSPROJ_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/InfoSlides.Cli/InfoSlides.Cli.csproj)"

          if [[ -z "$CSPROJ_VERSION" ]]; then
            echo "::error::Could not parse <Version> from InfoSlides.Cli.csproj" >&2
            exit 1
          fi

          echo "EXPECTED_VERSION=$CSPROJ_VERSION" >> "$GITHUB_ENV"
          echo "Expected version: $CSPROJ_VERSION"

      - name: Smoke test native binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN=src/InfoSlides.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/infoslides
          test "$($BIN --version)" = "$EXPECTED_VERSION"
          { printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'; sleep 2; } \
            | $BIN --mcp | grep -q '"serverInfo"'
      - name: Smoke test native binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "src/InfoSlides.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/infoslides.exe"
          if ((& $bin --version) -ne $env:EXPECTED_VERSION) { throw "version mismatch: expected $env:EXPECTED_VERSION" }
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          $out = $init | & $bin --mcp | Select-Object -First 1
          if ($out -notmatch '"serverInfo"') { throw "no initialize response: $out" }
      - uses: actions/upload-artifact@v4
        with:
          name: infoslides-${{ matrix.rid }}
          path: |
            src/InfoSlides.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/infoslides
            src/InfoSlides.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/infoslides.exe
          if-no-files-found: error
