# Add inside the existing `server { ... }` block for infoslides.app in /etc/nginx/sites-available/infoslides.
# Exact-match locations win over any broader prefix, so the MCP routes reach the MCP host while everything else
# (including /.well-known/oauth-authorization-server, jwks.json and the API) still goes to the API.

# The MCP endpoint (streamable HTTP; responses may stream, so do not buffer).
location = /mcp {
    proxy_pass http://127.0.0.1:5004;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# RFC 9728 protected resource metadata for the /mcp resource (the 401 challenge points here).
location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://127.0.0.1:5004;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
